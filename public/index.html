<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

      name="description"
      content="Architecture and interior design across Melbourne, the Mornington Peninsula, Sydney, London, and Ukraine — sustainable, client-focused residential and commercial projects by Stitch In Architecture."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a

    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/hero_video_poster.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/main_logo_white.png" fetchpriority="high" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <meta property="og:title" content="Stitch In Architecture — Melbourne, Mornington Peninsula, Sydney, London &amp; Ukraine" />
    <meta property="og:description" content="Architecture and interior design across Melbourne, the Mornington Peninsula, Sydney, London, and Ukraine — sustainable, client-focused projects." />
    <meta property="og:image" content="%PUBLIC_URL%/images/graphtag.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Stitch In Architecture</title>
